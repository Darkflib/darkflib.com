<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b18" />
    <meta name="description" content="SRE and systems demos you can break on purpose: retries, circuit breakers, and failover, run in your own browser." />
    <title>DEMOS — DARKFLIB</title>
    <link rel="canonical" href="https://darkflib.com/demos/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Darkflib" />
    <!-- Link previews. og:image is generated by `npm run images`; unfurlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darkflib" />
    <meta property="og:url" content="https://darkflib.com/demos/" />
    <meta property="og:title" content="DEMOS — DARKFLIB" />
    <meta property="og:description" content="SRE and systems demos you can break on purpose: retries, circuit breakers, and failover, run in your own browser." />
    <meta property="og:image" content="https://darkflib.com/images/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A neon cyberpunk city skyline at night" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- A data block, not a script: script-src does not apply, so the CSP stays as it is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "@id": "https://darkflib.com/demos/#page",
        "url": "https://darkflib.com/demos/",
        "name": "Demos",
        "description": "SRE and systems demos you can break on purpose.",
        "inLanguage": "en",
        "isPartOf": { "@id": "https://darkflib.com/#website" },
        "author": { "@id": "https://darkflib.com/#person" },
        "hasPart": [
          {
            "@type": "WebPageElement",
            "@id": "https://darkflib.com/demos/#fault-lab",
            "name": "Circuit breaker",
            "description": "Inject faults into this page's own API calls and watch retries, a circuit breaker, and failover."
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- For crawlers and unfurlers that do not run JavaScript, which otherwise see an empty page. -->
    <noscript>
      <h1>DEMOS</h1>
      <p>
        Reliability patterns you can break on purpose: a status client with retries, a circuit breaker, and failover,
        with faults injected by a service worker in your own browser. The demos need JavaScript.
      </p>
      <ul>
        <li><a href="/">Darkflib home</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/demos-main.tsx"></script>
  </body>
</html>
