      <h1>The queueing knee</h1>
      <p>Why does latency explode when the service is only 85% busy? Push utilisation from 70% to 95% and watch queue wait multiply, then make service times less predictable and watch it happen sooner. The demo needs JavaScript.</p>
      <h2>Wait grows with ρ/(1−ρ)</h2>
      <p>Going from 70% to 85% busy halves the headroom and roughly quadruples the wait. From 85% to 95% it does it again. &quot;We are only at 85% CPU&quot; is already a statement about latency.</p>
      <h2>Variability costs as much as load</h2>
      <p>Kingman's formula multiplies the wait by the variability of service times. A heavy tail at 80% can queue worse than predictable work at 95%: fix the slow requests before buying servers.</p>
      <h2>Little's law checks the model</h2>
      <p>L = λW holds for any stable queue. When the number in the system and arrival rate × time in system disagree, the queue is not in steady state, usually because it is still growing.</p>
