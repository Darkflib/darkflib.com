      <p>What happens when every knob is yours? Every queue and retry parameter the engine has, both disturbances, and six scenarios to start from. Build your own outage, then try to get out of it. The demo needs JavaScript.</p>
      <h2>Change one thing at a time</h2>
      <p>The other demos hold most of this still for a reason. Pick a scenario, change one control, and compare it with the scenario as it was.</p>
      <h2>The state pill is a heuristic</h2>
      <p>METASTABLE means goodput has collapsed with nothing disturbing the system and the backlog not shrinking. Unusual settings can fool it; the charts are the ground truth.</p>
      <h2>Seeded, so it repeats</h2>
      <p>Every run starts from the same seed. A scenario plays out the same way each time, and so does a setup of your own after RESET.</p>
