name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Biome
        run: npx biome ci --reporter=github .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: tsc (app, worker, node)
        run: npm run typecheck

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Browsers are not cached: Playwright advises against it, as restoring takes about as long as downloading.
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      # Typecheck runs in its own job; this is the production bundle the tests serve.
      - name: Build
        run: npx vite build
      - name: Playwright
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  container:
    name: Container build and deployment checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      # The bytes this job tested. publish refuses to push anything else.
      image-id: ${{ steps.build.outputs.image-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci

      - name: Shellcheck deployment scripts
        run: shellcheck deploy/install.sh deploy/scripts/*.sh

      # --format docker keeps the HEALTHCHECK that darkflib-web.container's Notify=healthy waits on.
      - name: Build image
        id: build
        run: |
          set -euo pipefail
          podman build --format docker --build-arg BUILD_SHA="$GITHUB_SHA" --tag darkflib.com:ci .
          image_id=$(podman image inspect darkflib.com:ci --format '{{.Id}}')
          echo "image-id=$image_id" >> "$GITHUB_OUTPUT"

      - name: Image carries a healthcheck, runs unprivileged, and has no setuid files
        run: |
          set -euo pipefail
          podman image inspect darkflib.com:ci --format '{{json .}}' > "$RUNNER_TEMP/image.json"
          jq -e '(.Healthcheck // .Config.Healthcheck // .HealthCheck) != null' "$RUNNER_TEMP/image.json" > /dev/null
          jq -e '.Config.User == "65532:65532"' "$RUNNER_TEMP/image.json" > /dev/null
          found=$(podman run --rm --user 0:0 --entrypoint find darkflib.com:ci / -xdev -perm /6000 -type f)
          if [ -n "$found" ]; then echo "::error::setuid/setgid files in image: $found"; exit 1; fi

      - name: Smoke test (routing, headers, cache policy, hardening)
        run: KEEP=1 CONTAINER_ENGINE=podman DARKFLIB_IMAGE=darkflib.com:ci deploy/scripts/smoke.sh

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser check under production headers
        run: npx playwright test -c playwright.deploy.config.ts
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-deploy
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      # The runner's podman (4.9) and nginx (1.24) are older than ny03's, and nginx 1.24 rejects `http2 on`. Run the
      # host-level checks on the Debian release ny03 runs instead.
      - name: Quadlet generation and nginx -t on Debian 13
        run: |
          podman run --rm --volume "$PWD:/src:ro" \
            docker.io/library/debian:trixie-slim@sha256:d7e12182ce18b85b93007c1dedf31f2d29e01ccf3182cc4017c709b6259bc132 \
            sh -euc 'apt-get update -qq
                     DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends podman nginx openssl > /dev/null
                     podman --version
                     nginx -v
                     /src/deploy/scripts/check-quadlets.sh
                     /src/deploy/scripts/check-nginx.sh'

      # One digest, set by promote.sh, never a floating tag, and the same one in every unit that runs the image:
      # kev-snapshot writes the document the page reads, so the two must never be from different builds. `unpromoted`
      # is the bootstrap marker before the first publish exists; it is reported, and verification is skipped only then.
      - name: The deployed image is pinned by digest
        id: pin
        run: |
          set -euo pipefail
          refs=$(sed -n 's/^Image=//p' deploy/quadlet/*.container | sort -u)
          if [ "$(printf '%s\n' "$refs" | wc -l)" -ne 1 ]; then
            echo "::error::deploy/quadlet units pin different images:"; printf '%s\n' "$refs"; exit 1
          fi
          ref=$refs
          case "$ref" in
            ghcr.io/darkflib/darkflib.com:unpromoted)
              echo "::warning::darkflib-web.container is not promoted yet; run deploy/scripts/promote.sh after the first publish"
              echo "promoted=false" >> "$GITHUB_OUTPUT" ;;
            ghcr.io/darkflib/darkflib.com:*@sha256:*|ghcr.io/darkflib/darkflib.com@sha256:*)
              echo "promoted=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Image= must be pinned by digest via deploy/scripts/promote.sh: $ref"
              exit 1 ;;
          esac
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.pin.outputs.promoted == 'true'
      - name: The pinned image is signed, with provenance and an SBOM
        if: steps.pin.outputs.promoted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: deploy/scripts/verify-image.sh --require-attestations

      - name: Export the tested image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: podman save --format docker-archive --output "$RUNNER_TEMP/image.tar" darkflib.com:ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: tested-image
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
          compression-level: 0

  # Publishes the exact image `container` tested: pushed by digest, keyless-signed with cosign, and attested with SLSA
  # provenance and an SPDX SBOM. Deploying it is a separate, reviewed step (deploy/scripts/promote.sh).
  #
  # Gated on the repository being public: GitHub artifact attestations and anonymous pulls on ny03 both depend on it.
  # workflow_dispatch on main republishes without a commit (e.g. after a base-image digest bump lands). A re-run of an
  # old run replays that run's event payload, including the visibility it recorded, so dispatch rather than re-run.
  publish:
    name: Publish, sign, and attest image
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && !github.event.repository.private
    needs: [lint, typecheck, e2e, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # push the image and its signature
      id-token: write # keyless signing: the OIDC token is the identity
      attestations: write # provenance and SBOM
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          path: ${{ runner.temp }}

      - name: Load the tested image and check it is the one that was tested
        env:
          TESTED_ID: ${{ needs.container.outputs.image-id }}
        run: |
          set -euo pipefail
          test -n "$TESTED_ID" || { echo "::error::container job published no image id"; exit 1; }
          podman load --input "$RUNNER_TEMP/image.tar"
          loaded_id=$(podman image inspect darkflib.com:ci --format '{{.Id}}')
          if [ "$loaded_id" != "$TESTED_ID" ]; then
            echo "::error::darkflib.com:ci is $loaded_id, but the tested image was $TESTED_ID"
            exit 1
          fi

      - name: Publish
        id: publish
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          # ~/.docker/config.json is the one credential path podman, cosign, syft, and the attest actions all read.
          mkdir -p "$HOME/.docker"
          authfile="$HOME/.docker/config.json"
          printf '%s' "$GHCR_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin --authfile "$authfile"
          podman tag darkflib.com:ci "$image:sha-$GITHUB_SHA"
          podman push --authfile "$authfile" --digestfile "$RUNNER_TEMP/digest" "$image:sha-$GITHUB_SHA"
          # Convenience only: nothing deploys :latest.
          podman tag darkflib.com:ci "$image:latest"
          podman push --authfile "$authfile" "$image:latest"
          digest=$(cat "$RUNNER_TEMP/digest")
          { echo "image=$image"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
          echo "published $image:sha-$GITHUB_SHA at $digest"

      - name: Sign the manifest
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: SLSA build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Generate an SBOM from the pushed image
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: syft "registry:${IMAGE}@${DIGEST}" -o "spdx-json=$RUNNER_TEMP/sbom.spdx.json"

      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sbom.spdx.json
          push-to-registry: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: ${{ runner.temp }}/sbom.spdx.json
          retention-days: 90

      # Produced is not verified: run the operator's own check against what was just pushed.
      - name: Verify what was just published
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          echo "Promote with: deploy/scripts/promote.sh ${IMAGE}:sha-${GITHUB_SHA}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          deploy/scripts/verify-image.sh --require-attestations "${IMAGE}@${DIGEST}"
