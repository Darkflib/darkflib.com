# darkflib.com, darkflib.dev, and both wildcards → darkflib-web (Caddy) on loopback.
#
# Installed to /etc/nginx/conf.d by `deploy/install.sh --nginx`, which runs `nginx -t` and restores the previous file
# on failure. conf.d is included inside nginx's http block, so the upstream, cache path, and map below are legal here.
#
# Division of labour, as in sre-tab's TLS-termination contract: nginx owns TLS, the edge cache, and the client address;
# Caddy owns routing by name, security headers, and Cache-Control. Do not add Cache-Control or security headers here.

upstream darkflib_web {
    # DARKFLIB_WEB_PORT in /etc/darkflib/install.env. Keep the two in step.
    server 127.0.0.1:8082;
    keepalive 16;
}

# Edge cache. nginx honours upstream Cache-Control, so only what Caddy marks cacheable is stored: hashed /assets/
# (immutable) and /images/ (a day). The document and /service-worker.js are no-cache, and redirects and 404s carry no
# freshness, so none of those are ever served from here.
proxy_cache_path /var/cache/nginx/darkflib levels=1:2 keys_zone=darkflib:10m max_size=256m inactive=7d use_temp_path=off;

# HIT, MISS, REVALIDATED, STALE, ... Responses nginx will not store (the document, the worker, redirects, 404s) report
# MISS on every request; BYPASS covers anything that never reached the cache at all.
map $upstream_cache_status $darkflib_edge_cache {
    ""      BYPASS;
    default $upstream_cache_status;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # A leading dot matches the apex and every subdomain.
    server_name .darkflib.com;

    # certbot certificate for darkflib.com and *.darkflib.com (Vultr DNS-01), issued off-host and copied here with
    # certbot's live/darkflib.com/ layout. See deploy/README.md.
    ssl_certificate     /etc/nginx/certs/darkflib.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/darkflib.com/privkey.pem;

    include /etc/nginx/snippets/tls-modern-mozilla.conf;

    # Real edge cache state for the page's telemetry (Navigation/Resource Timing serverTiming). Declared at server
    # level beside any add_header from the TLS snippet, so neither shadows the other. If that snippet also sets HSTS,
    # browsers see Caddy's copy as well; the values agree, so it is untidy rather than wrong.
    add_header Server-Timing "edge;desc=$darkflib_edge_cache" always;

    location / {
        proxy_pass http://darkflib_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never append: a client-supplied X-Forwarded-For must not reach Caddy's access log as fact.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;

        proxy_cache darkflib;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        # Keep serving cached assets through a restart of darkflib-web.
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # A leading dot matches the apex and every subdomain.
    server_name .darkflib.dev;

    # Separate certbot certificate for darkflib.dev and *.darkflib.dev, so issuing it needs no --expand of the .com
    # certificate. Caddy currently redirects these names to darkflib.com; the Fault Lab's cross-site origins will
    # live here. The location is deliberately identical to the one above: routing by name happens in Caddy.
    ssl_certificate     /etc/nginx/certs/darkflib.dev/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/darkflib.dev/privkey.pem;

    include /etc/nginx/snippets/tls-modern-mozilla.conf;

    # Real edge cache state for the page's telemetry (Navigation/Resource Timing serverTiming). Declared at server
    # level beside any add_header from the TLS snippet, so neither shadows the other. If that snippet also sets HSTS,
    # browsers see Caddy's copy as well; the values agree, so it is untidy rather than wrong.
    add_header Server-Timing "edge;desc=$darkflib_edge_cache" always;

    location / {
        proxy_pass http://darkflib_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, never append: a client-supplied X-Forwarded-For must not reach Caddy's access log as fact.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;

        proxy_cache darkflib;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_revalidate on;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        # Keep serving cached assets through a restart of darkflib-web.
        proxy_cache_use_stale error timeout updating http_502 http_503 http_504;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name .darkflib.com .darkflib.dev;

    return 301 https://$host$request_uri;
}
