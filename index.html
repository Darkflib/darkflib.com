<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b18" />
    <meta name="description" content="Darkflib — creative systems, experiments, and digital experiences." />
    <title>DARKFLIB — Creative systems</title>
    <link rel="canonical" href="https://darkflib.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Darkflib" />
    <!-- Link previews. og:image is generated by `npm run images`; unfurlers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Darkflib" />
    <meta property="og:url" content="https://darkflib.com/" />
    <meta property="og:title" content="DARKFLIB — Creative systems" />
    <meta property="og:description" content="Darkflib — creative systems, experiments, and digital experiences." />
    <meta property="og:image" content="https://darkflib.com/images/og-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A neon cyberpunk city skyline at night" />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- A data block, not a script: script-src does not apply, so the CSP stays as it is. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://darkflib.com/#website",
            "url": "https://darkflib.com/",
            "name": "Darkflib",
            "description": "Creative systems, experiments, and digital experiences.",
            "inLanguage": "en",
            "publisher": { "@id": "https://darkflib.com/#person" }
          },
          {
            "@type": "Person",
            "@id": "https://darkflib.com/#person",
            "name": "Darkflib",
            "url": "https://darkflib.com/",
            "sameAs": ["https://mikepreston.org", "https://github.com/Darkflib"]
          }
        ]
      }
    </script>
    <!-- The hero is rendered client-side; preload it so the LCP image isn't discovered only after the JS runs. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      fetchpriority="high"
      imagesrcset="/images/hero-city-800.avif 800w, /images/hero-city-1280.avif 1280w, /images/hero-city-1672.avif 1672w"
      imagesizes="(max-width: 560px) 1049px, (max-width: 800px) 1173px, 100vw"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- For crawlers and unfurlers that do not run JavaScript, which otherwise see an empty page. -->
    <noscript>
      <h1>DARKFLIB</h1>
      <p>
        Creative developer, digital explorer, breaking things on purpose. This site is an interactive interface built
        on live browser telemetry and a client-side Fault Lab, and needs JavaScript.
      </p>
      <ul>
        <li><a href="https://mikepreston.org/projects">Projects</a></li>
        <li><a href="https://mikepreston.org/writing">Writing</a></li>
        <li><a href="https://tools.mikepreston.org">Tools</a></li>
        <li><a href="https://github.com/Darkflib">GitHub</a></li>
        <li><a href="https://mikepreston.org/contact">Contact</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
